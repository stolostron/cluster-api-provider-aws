name: ci-cluster-api-provider-aws-config
on:
  pull_request:
    paths:
      - '*/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./stolostron
    steps:
      - uses: actions/checkout@v4
      - name: docker-build
        env:
          AUTH_JSON: ${{ secrets.AUTH_JSON }}
        run: |
          set -euo pipefail

          DOCKER_CONFIG="$(mktemp -d)"
          chmod 700 "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "$AUTH_JSON" > "$DOCKER_CONFIG/config.json"
          chmod 600 "$DOCKER_CONFIG/config.json"
          unset AUTH_JSON

          export DOCKER_CONFIG
          make docker-build
